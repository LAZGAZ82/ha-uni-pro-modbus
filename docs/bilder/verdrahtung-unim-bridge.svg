<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
  <!-- Quelle der Grafik "RS485-Verdrahtung mit UNIM-PRO-Erweiterungsmodul" (Anleitung v1.5, Kap. 4.4).
       Nach der Vorlage des Inhabers vom 24.11.2026. GND Regler <-> UNIM PRO zwingend
       (Herstellervorgabe); Bridge-GND (-V der Versorgungsklemme) empfohlen, gestrichelt
       (Gegentest 24.11.2026: ohne Bridge-GND fehlerfrei).
       Farben: A blau #1d6fe8, B orange #e0520f, GND schwarz. -->
  <rect width="1600" height="980" fill="#fff"/>
  <text x="800" y="62" text-anchor="middle" font-size="34" font-weight="700" fill="#1f2a37">RS485-Verdrahtung mit UNIM-PRO-Erweiterungsmodul</text>
  <text x="800" y="102" text-anchor="middle" font-size="21" fill="#5b6472">UNIM PRO gerade · Bridge gekreuzt · GND Regler ↔ UNIM PRO zwingend</text>

  <!-- Regler -->
  <rect x="520" y="150" width="560" height="250" rx="16" fill="#eef1f6" stroke="#3c4a5e" stroke-width="3"/>
  <text x="800" y="200" text-anchor="middle" font-size="30" font-weight="700" fill="#1f2a37">Regler UNI2 PRO / UNI3 PRO</text>
  <text x="800" y="236" text-anchor="middle" font-size="19" fill="#5b6472">RS485-Klemmenblock</text>
  <g font-size="25" font-weight="700" text-anchor="middle">
    <rect x="565" y="290" width="84" height="74" rx="8" fill="#fff" stroke="#3c4a5e" stroke-width="3"/><text x="607" y="337" fill="#1d6fe8">A</text>
    <rect x="663" y="290" width="84" height="74" rx="8" fill="#fff" stroke="#3c4a5e" stroke-width="3"/><text x="705" y="337" fill="#e0520f">B</text>
    <rect x="761" y="290" width="84" height="74" rx="8" fill="#fff" stroke="#3c4a5e" stroke-width="3"/><text x="803" y="337" fill="#222">GND</text>
    <rect x="859" y="290" width="84" height="74" rx="8" fill="#fff" stroke="#3c4a5e" stroke-width="3"/><text x="901" y="337" fill="#1d6fe8">A</text>
    <rect x="957" y="290" width="84" height="74" rx="8" fill="#fff" stroke="#3c4a5e" stroke-width="3"/><text x="999" y="337" fill="#e0520f">B</text>
  </g>
  <text x="656" y="390" text-anchor="middle" font-size="16" fill="#5b6472">Paar 1</text>
  <text x="950" y="390" text-anchor="middle" font-size="16" fill="#5b6472">Paar 2</text>

  <!-- UNIM PRO -->
  <rect x="90" y="600" width="520" height="260" rx="16" fill="#edf6ee" stroke="#2e7d32" stroke-width="3"/>
  <g font-size="25" font-weight="700" text-anchor="middle">
    <rect x="160" y="616" width="84" height="74" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="3"/><text x="202" y="663" fill="#1d6fe8">A</text>
    <rect x="292" y="616" width="84" height="74" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="3"/><text x="334" y="663" fill="#e0520f">B</text>
    <rect x="424" y="616" width="84" height="74" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="3"/><text x="466" y="663" fill="#222">GND</text>
  </g>
  <text x="350" y="752" text-anchor="middle" font-size="29" font-weight="700" fill="#1f2a37">UNIM PRO</text>
  <text x="350" y="785" text-anchor="middle" font-size="18" fill="#5b6472">Erweiterungsmodul (Heizkreis CO4)</text>
  <text x="120" y="842" font-size="18" font-weight="700" fill="#1f2a37">DIP:</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="185" y="810">1</text><text x="217" y="810">2</text><text x="249" y="810">3</text><text x="281" y="810">4</text>
  </g>
  <g stroke="#333" stroke-width="2" fill="#fff">
    <rect x="172" y="818" width="26" height="34" rx="4"/><rect x="204" y="818" width="26" height="34" rx="4"/>
    <rect x="236" y="818" width="26" height="34" rx="4"/><rect x="268" y="818" width="26" height="34" rx="4"/>
  </g>
  <rect x="176" y="822" width="18" height="12" fill="#2e7d32"/>
  <rect x="208" y="836" width="18" height="12" fill="#888"/><rect x="240" y="836" width="18" height="12" fill="#888"/><rect x="272" y="836" width="18" height="12" fill="#888"/>
  <text x="310" y="842" font-size="16" fill="#1f2a37">Schalter 1 = ON → Modul 1 / CO4</text>

  <!-- Bridge -->
  <rect x="990" y="600" width="520" height="260" rx="16" fill="#eef3fb" stroke="#2556a8" stroke-width="3"/>
  <g font-size="25" font-weight="700" text-anchor="middle">
    <rect x="1060" y="616" width="84" height="74" rx="8" fill="#fff" stroke="#2556a8" stroke-width="3"/><text x="1102" y="663" fill="#1d6fe8">A+</text>
    <rect x="1192" y="616" width="84" height="74" rx="8" fill="#fff" stroke="#2556a8" stroke-width="3"/><text x="1234" y="663" fill="#e0520f">B−</text>
    <rect x="1300" y="616" width="130" height="74" rx="8" fill="#fff" stroke="#2556a8" stroke-width="3"/><text x="1365" y="653" fill="#222" font-size="23">GND</text><text x="1365" y="679" fill="#222" font-size="17">(−V)</text>
  </g>
  <text x="1250" y="752" text-anchor="middle" font-size="29" font-weight="700" fill="#1f2a37">Bridge (Waveshare)</text>
  <text x="1250" y="785" text-anchor="middle" font-size="18" fill="#5b6472">ESP32-S3 RS485 · 120-Ω-Jumper gesteckt</text>
  <text x="1250" y="815" text-anchor="middle" font-size="16" fill="#5b6472">RS485-Klemme nur A+/B− · GND (−V) empfohlen</text>

  <!-- Leitungen -->
  <polyline points="607,364 607,520 202,520 202,616" fill="none" stroke="#1d6fe8" stroke-width="6"/>
  <polyline points="705,364 705,550 334,550 334,616" fill="none" stroke="#e0520f" stroke-width="6"/>
  <polyline points="790,364 790,580 466,580 466,616" fill="none" stroke="#222" stroke-width="6"/>
  <polyline points="816,364 816,580 1365,580 1365,616" fill="none" stroke="#222" stroke-width="6" stroke-dasharray="16 10"/>
  <text x="1380" y="572" font-size="17" font-style="italic" fill="#5b6472">empfohlen</text>
  <polyline points="901,364 901,520 1234,520 1234,616" fill="none" stroke="#e0520f" stroke-width="6"/>
  <polyline points="999,364 999,550 1102,550 1102,616" fill="none" stroke="#1d6fe8" stroke-width="6"/>

  <rect x="236" y="452" width="282" height="40" rx="20" fill="#2e7d32"/>
  <text x="377" y="479" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">GERADE: A→A, B→B</text>
  <rect x="1086" y="452" width="370" height="40" rx="20" fill="#c62828"/>
  <text x="1271" y="479" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">GEKREUZT: A+→B, B−→A</text>
  <rect x="630" y="700" width="340" height="40" rx="20" fill="#222"/>
  <text x="800" y="727" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">GND Regler ↔ UNIM PRO zwingend</text>

  <text x="800" y="922" text-anchor="middle" font-size="18" fill="#3c4a5e">Am Regler: [13-12-3] Modul 1 aktivieren + MODBUS RTU an → aus- und wieder einschalten. Danach ca. 1 Minute bis zur ersten Antwort.</text>
  <text x="800" y="952" text-anchor="middle" font-size="15" fill="#8a8f98">Verdrillte, geschirmte Leitung (z. B. J-Y(St)Y), Schirm einseitig auflegen · Arbeiten nur spannungsfrei</text>
</svg>
