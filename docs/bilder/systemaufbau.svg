<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
  <!-- Quelle der Grafik "Systemaufbau" in Kap. 1 der Anleitung v1.5 (ersetzt das alte Bild mit
       ueberlappenden Beschriftungen). Stil wie verdrahtung-*.svg. -->
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3c4a5e"/>
    </marker>
  </defs>
  <rect width="1600" height="620" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#1f2a37">Systemaufbau</text>
  <text x="800" y="96" text-anchor="middle" font-size="20" fill="#5b6472">vollständig lokal – ohne Cloud, ohne Herstellerkonto</text>

  <!-- Regler -->
  <rect x="60" y="150" width="400" height="250" rx="18" fill="#eef1f6" stroke="#3c4a5e" stroke-width="3"/>
  <text x="260" y="205" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2a37">Heizungsregler</text>
  <text x="260" y="245" text-anchor="middle" font-size="21" fill="#1f2a37">Euroster UNI2 PRO / UNI3 PRO</text>
  <text x="260" y="290" text-anchor="middle" font-size="18" fill="#5b6472">eigene Heizkreise je nach Modell</text>
  <text x="260" y="316" text-anchor="middle" font-size="18" fill="#5b6472">Warmwasser + Zirkulation: nur UNI2 PRO</text>
  <text x="260" y="370" text-anchor="middle" font-size="18" fill="#5b6472">RS485-Klemmen A · B · GND</text>

  <!-- Bridge -->
  <rect x="600" y="150" width="400" height="250" rx="18" fill="#eef3fb" stroke="#2556a8" stroke-width="3"/>
  <text x="800" y="205" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2a37">Bridge</text>
  <text x="800" y="245" text-anchor="middle" font-size="21" fill="#1f2a37">Waveshare ESP32-S3 (Hutschiene)</text>
  <text x="800" y="290" text-anchor="middle" font-size="18" fill="#5b6472">Modbus TCP ↔ RTU-Gateway</text>
  <text x="800" y="316" text-anchor="middle" font-size="18" fill="#5b6472">ohne Gerätelogik – nie neu flashen</text>
  <text x="800" y="370" text-anchor="middle" font-size="18" fill="#5b6472">12 V DC (Netzteil DIN15W12)</text>

  <!-- Home Assistant -->
  <rect x="1140" y="150" width="400" height="250" rx="18" fill="#edf6ee" stroke="#2e7d32" stroke-width="3"/>
  <text x="1340" y="205" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2a37">Home Assistant</text>
  <text x="1340" y="245" text-anchor="middle" font-size="21" fill="#1f2a37">Integration „UNI PRO Modbus“</text>
  <text x="1340" y="290" text-anchor="middle" font-size="18" fill="#5b6472">gesamte Gerätelogik</text>
  <text x="1340" y="316" text-anchor="middle" font-size="18" fill="#5b6472">Updates über HACS</text>
  <text x="1340" y="370" text-anchor="middle" font-size="18" fill="#5b6472">Dashboard · Zeitprogramme</text>

  <!-- Verbindungen: Beschriftung ueber/unter der Linie, nicht auf den Kaesten -->
  <line x1="468" y1="275" x2="592" y2="275" stroke="#3c4a5e" stroke-width="5" marker-start="url(#pfeil)" marker-end="url(#pfeil)"/>
  <text x="530" y="250" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2a37">RS485</text>
  <text x="530" y="306" text-anchor="middle" font-size="15" fill="#5b6472">Modbus RTU</text>
  <text x="530" y="326" text-anchor="middle" font-size="15" fill="#5b6472">9600 8N1</text>

  <line x1="1008" y1="275" x2="1132" y2="275" stroke="#3c4a5e" stroke-width="5" stroke-dasharray="14 9" marker-start="url(#pfeil)" marker-end="url(#pfeil)"/>
  <text x="1070" y="250" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2a37">WLAN</text>
  <text x="1070" y="306" text-anchor="middle" font-size="15" fill="#5b6472">Modbus TCP</text>
  <text x="1070" y="326" text-anchor="middle" font-size="15" fill="#5b6472">Port 502</text>

  <!-- optional UNIM PRO -->
  <rect x="60" y="460" width="400" height="110" rx="18" fill="#fff" stroke="#2e7d32" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="260" y="505" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2a37">optional: UNIM PRO</text>
  <text x="260" y="540" text-anchor="middle" font-size="17" fill="#5b6472">Erweiterungsmodule → Kreise CO4–CO7</text>
  <line x1="260" y1="404" x2="260" y2="456" stroke="#2e7d32" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="275" y="436" font-size="15" fill="#5b6472">am selben RS485-Bus (Kap. 4.4)</text>

  <text x="1070" y="520" text-anchor="middle" font-size="17" fill="#5b6472">In Home Assistant immer die <tspan font-weight="700" fill="#1f2a37">IP-Adresse</tspan> der Bridge eintragen</text>
  <text x="1070" y="546" text-anchor="middle" font-size="17" fill="#5b6472">(nicht uni-pro-bridge.local) – Kap. 7.2</text>
</svg>
