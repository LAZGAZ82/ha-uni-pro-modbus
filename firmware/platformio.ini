; UNI PRO Modbus Bridge - PlatformIO-Projekt
; Zielboard: Waveshare ESP32-S3-RS485-CAN (Hutschienengehaeuse)
;
; Es gibt kein dediziertes PlatformIO-Boardprofil fuer dieses Waveshare-Board.
; Das generische ESP32-S3-DevKitC-1-Profil passt (gleicher Chip); sollte das
; Board nach dem Flashen in einer Bootschleife haengen, board_upload.flash_size
; an das tatsaechlich verbaute Flash anpassen (siehe FLASHEN.md).

[env:unipro_bridge]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Bibliotheken werden direkt von GitHub bezogen und auf einen Stand
; festgepinnt, damit jeder Build reproduzierbar ist (Produktanforderung).
lib_deps =
    https://github.com/eModbus/eModbus.git#v1.7.2stable
    https://github.com/tzapu/WiFiManager.git#v2.0.17

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
